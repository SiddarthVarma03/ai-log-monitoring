services:

  kafka:
    image: apache/kafka:4.4.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:29092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

    volumes:
      - ./kafka-data:/tmp/kraft-combined-logs

    networks:
      - ai-log-network

    restart: unless-stopped


  postgres:
    image: postgres:16
    container_name: postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - ai-log-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  redis:
    image: redis:7
    container_name: redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - ai-log-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


  api:
    build:
      context: .
      dockerfile: Dockerfile.api

    image: ai-log-api:v2
    container_name: ai-log-api

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    ports:
      - "8000:8000"

    depends_on:
      - kafka

    networks:
      - ai-log-network

    restart: unless-stopped


  detector:
    build:
      context: .
      dockerfile: Dockerfile.detector

    image: ai-log-detector:v3
    container_name: ai-log-detector

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      - kafka

    networks:
      - ai-log-network

    restart: unless-stopped


  aiworker:
    build:
      context: .
      dockerfile: Dockerfile.aiworker

    image: ai-log-aiworker:v1
    container_name: ai-log-aiworker

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

    networks:
      - ai-log-network

    restart: unless-stopped


  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard

    image: ai-log-dashboard:v1
    container_name: ai-log-dashboard

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

    ports:
      - "8501:8501"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ai-log-network

    restart: unless-stopped


networks:
  ai-log-network:
    name: ai-log-network
    external: true


volumes:

  postgres-data:
  redis-data: